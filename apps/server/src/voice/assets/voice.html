<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#111417" />
    <title>fwai 语音</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #111417;
        --panel: #1a1f24;
        --line: #2a3138;
        --text: #e8ecef;
        --dim: #8b959e;
        --accent: #3fb6a8;
        --listen: #e5484d;
        --think: #d9a43c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Helvetica Neue",
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }
      header {
        padding: 14px 18px 10px;
        border-bottom: 1px solid var(--line);
      }
      header .title {
        font-size: 13px;
        color: var(--dim);
        letter-spacing: 0.04em;
      }
      header .current {
        display: block;
        margin-top: 2px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--text);
        font: inherit;
        font-size: 15px;
        text-align: left;
        cursor: pointer;
      }
      header .current::after {
        content: "  全部 ›";
        color: var(--dim);
        font-size: 13px;
      }
      #sheet {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }
      #sheet[hidden] {
        display: none;
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        font-size: 15px;
      }
      .sheet-head button {
        padding: 4px 12px;
        font: inherit;
        font-size: 14px;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      #sessions {
        list-style: none;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        flex: 1;
      }
      #sessions li {
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      #sessions li.current {
        background: var(--panel);
        box-shadow: 3px 0 0 var(--accent) inset;
      }
      #sessions .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #sessions .name {
        flex: 1;
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #sessions .status {
        font-size: 12px;
        padding: 1px 8px;
        border-radius: 9px;
        color: var(--dim);
        border: 1px solid var(--line);
      }
      #sessions .status.running {
        color: var(--accent);
        border-color: var(--accent);
      }
      #sessions .status.waiting {
        color: var(--think);
        border-color: var(--think);
      }
      #sessions .status.failed {
        color: var(--listen);
        border-color: var(--listen);
      }
      #sessions .unread {
        font-size: 12px;
        min-width: 18px;
        padding: 0 6px;
        border-radius: 9px;
        text-align: center;
        color: #111417;
        background: var(--think);
      }
      #sessions .meta {
        margin-top: 2px;
        font-size: 12px;
        color: var(--dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #debugToggle {
        float: right;
        margin-left: 10px;
        padding: 2px 10px;
        font: inherit;
        font-size: 12px;
        color: var(--dim);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      #debugToggle.on {
        color: var(--text);
        border-color: var(--accent);
      }
      #passiveToggle {
        float: right;
        margin-left: 10px;
        padding: 2px 10px;
        font: inherit;
        font-size: 12px;
        color: var(--dim);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      #detailToggle {
        float: right;
        margin-left: 10px;
        padding: 2px 10px;
        font: inherit;
        font-size: 12px;
        color: var(--dim);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      #detailToggle.on {
        color: #111417;
        background: var(--accent);
        border-color: var(--accent);
      }
      #passiveToggle.on {
        color: #111417;
        background: var(--think);
        border-color: var(--think);
      }
      header .headset {
        float: right;
        margin-right: 10px;
        font-size: 12px;
        color: var(--dim);
      }
      header .headset.ready {
        color: var(--accent);
      }
      header .conn {
        float: right;
        font-size: 12px;
        color: var(--dim);
      }
      header .conn.ok::before {
        content: "● ";
        color: var(--accent);
      }
      header .conn.bad::before {
        content: "● ";
        color: var(--listen);
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
      }
      #talk {
        width: min(56vw, 240px);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 0;
        cursor: pointer;
        background: var(--panel);
        color: var(--text);
        font-size: 18px;
        font-family: inherit;
        box-shadow: 0 0 0 2px var(--line) inset;
        transition:
          background 0.15s,
          box-shadow 0.15s,
          transform 0.1s;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #talk:active {
        transform: scale(0.97);
      }
      #talk.starting {
        box-shadow: 0 0 0 3px var(--listen) inset;
      }
      #talk.listening {
        background: var(--listen);
        box-shadow: 0 0 0 10px rgba(229, 72, 77, 0.18);
        animation: pulse 1.4s ease-in-out infinite;
      }
      #talk.thinking {
        box-shadow: 0 0 0 3px var(--think) inset;
        color: var(--think);
      }
      #talk:disabled {
        opacity: 0.45;
        cursor: default;
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 18px rgba(229, 72, 77, 0.08);
        }
      }
      #hint {
        min-height: 3em;
        text-align: center;
        color: var(--dim);
        font-size: 14px;
        max-width: 28em;
      }
      #log {
        list-style: none;
        margin: 0;
        padding: 0 18px 18px;
        max-height: 38vh;
        overflow-y: auto;
      }
      #log li {
        padding: 8px 0;
        border-top: 1px solid var(--line);
        font-size: 15px;
      }
      #log li .who {
        display: inline-block;
        width: 1.6em;
      }
      #log li.heard {
        color: var(--text);
      }
      #log li.say {
        color: #c9d1d8;
      }
      #log li.error {
        color: var(--think);
      }
      #update {
        display: block;
        width: 100%;
        padding: 10px 18px;
        border: 0;
        font: inherit;
        font-size: 14px;
        color: #111417;
        background: var(--think);
        text-align: left;
      }
      #update[hidden] {
        display: none;
      }
      #debug {
        display: none;
        margin: 0;
        padding: 10px 18px;
        max-height: 32vh;
        overflow-y: auto;
        white-space: pre-wrap;
        font:
          12px/1.45 ui-monospace,
          Menlo,
          monospace;
        color: #c9d1d8;
        background: #0b0d0f;
        border-bottom: 1px solid var(--line);
      }
      #debug.open {
        display: block;
      }
      #log li .to {
        color: var(--accent);
        font-size: 13px;
      }
      #log li time {
        float: right;
        color: var(--dim);
        font-size: 12px;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <header>
      <button id="debugToggle">调试</button>
      <button id="passiveToggle" title="被动模式：进度不主动播，想听再说“听通知”">被动：关</button>
      <button id="detailToggle" title="详细模式：回复基本照原文念，不压缩">详细：关</button>
      <span class="conn" id="conn">连接中</span>
      <span class="headset" id="headset"></span>
      <div class="title" id="title">VOICE-PILOT</div>
      <button class="current" id="current">…</button>
    </header>
    <div id="sheet" hidden>
      <div class="sheet-head"><span>全部 session</span><button id="sheetClose">关闭</button></div>
      <ul id="sessions"></ul>
    </div>
    <pre id="debug">（还没有记录。点大按钮或按耳机键后，这里会显示每一步。）</pre>
    <button id="update" hidden onclick="location.reload()">
      页面有更新，点这里刷新（刷新后再点一次大按钮，耳机键才能用）
    </button>
    <main>
      <button id="talk" disabled>点一下说话</button>
      <div id="hint"></div>
    </main>
    <ul id="log"></ul>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const talk = $("talk"),
        hint = $("hint"),
        log = $("log");

      const PAGE_VERSION = "__PAGE_VERSION__"; // filled in by the server

      let ws = null;
      let state = "idle"; // idle | starting | listening | thinking
      let ctx = null; // AudioContext, created on the first tap (browsers require a gesture)
      let mic = null; // { stream, source, node }
      let wakeLock = null;

      const LABELS = {
        idle: "点一下说话",
        starting: "准备麦克风…",
        listening: "在听…",
        thinking: "识别中…",
      };
      const HINTS = {
        idle: "",
        starting: "",
        listening: "说完停顿一下会自动发送，再点一下可以提前结束",
        thinking: "",
      };

      function tagLog(li, session) {
        const tag = document.createElement("span");
        tag.className = "to";
        tag.textContent = ` → ${session}`;
        li.append(tag);
      }

      function setState(next) {
        if (next !== state) dbg(`state: ${next}`);
        state = next;
        talk.className = next === "idle" ? "" : next;
        talk.textContent = LABELS[next];
        talk.disabled = !ws || ws.readyState !== WebSocket.OPEN || next === "thinking";
        if (HINTS[next] || next !== "idle") hint.textContent = HINTS[next];
        if (typeof showHeadset === "function") showHeadset();
      }

      function addLog(kind, text, at = new Date(), session = null) {
        const li = document.createElement("li");
        li.className = kind;
        const who = { heard: "🎤", say: "🔊", error: "⚠️" }[kind];
        const time = at.toTimeString().slice(0, 5);
        li.innerHTML = `<time>${time}</time><span class="who">${who}</span>`;
        li.append(document.createTextNode(text));
        if (session) tagLog(li, session);
        log.prepend(li);
        while (log.children.length > 60) log.lastChild.remove();
      }

      // --- Connection -------------------------------------------------------------------

      function connect() {
        const scheme = location.protocol === "https:" ? "wss" : "ws";
        ws = new WebSocket(`${scheme}://${location.host}/voice/ws`); // the session cookie authenticates it
        ws.binaryType = "arraybuffer";
        ws.onopen = () => {
          flushDebug();
          connectionBack();
          dbg(
            `connected; player ${player ? (player.paused ? "paused" : "playing") : "not armed"}; ${navigator.userAgent.slice(0, 80)}`,
          );
          $("conn").textContent = "已连接";
          $("conn").className = "conn ok";
          setState("idle");
          if (!ctx) hint.textContent = "第一次点按钮时会请求麦克风权限，之后播报也会从这里出声。";
        };
        ws.onclose = (event) => {
          $("conn").textContent = everConnected ? "断开了，重连中" : "没登录 fwai 或服务没开";
          $("conn").className = "conn bad";
          stopMic();
          setState("idle");
          connectionLost();
          setTimeout(connect, 2000);
        };
        ws.addEventListener("open", () => {
          everConnected = true;
        });
        ws.onmessage = (event) => {
          if (typeof event.data !== "string") return speechChunk(event.data);
          const msg = JSON.parse(event.data);
          switch (msg.type) {
            case "live":
              beep([660, 990]);
              setState("listening");
              break;
            case "mic_stop":
              if (state === "listening") beep([990, 660]);
              stopMic();
              if (state === "starting" || state === "listening") setState("thinking");
              break;
            case "heard":
              addLog("heard", msg.text);
              setState("idle");
              break;
            case "error":
              addLog("error", msg.text);
              stopMic();
              setState("idle");
              break;
            case "say":
              addLog("say", msg.text);
              sayFollowup = msg.followup || null; // news from that session: listen for a reply after it
              break;
            case "nothing": // the reply window closed in silence
              setState("idle");
              break;
            case "hello":
              if (msg.version !== PAGE_VERSION) {
                dbg(`page is stale (${PAGE_VERSION} → ${msg.version})`);
                $("update").hidden = false;
              }
              break;
            case "current":
              $("current").textContent = msg.text;
              break;
            case "history":
              // Kept on the server, so a reload or another device shows the same log.
              log.replaceChildren();
              for (const e of msg.items)
                addLog(
                  e.kind === "said" ? "say" : "heard",
                  e.text,
                  new Date(e.at * 1000),
                  e.session,
                );
              break;
            case "tag": {
              // which session the last thing you said went to
              const li = log.querySelector("li.heard");
              if (li) tagLog(li, msg.session);
              break;
            }
            case "sessions":
              renderSessions(msg.items);
              break;
            case "detail":
              $("detailToggle").classList.toggle("on", msg.on);
              $("detailToggle").textContent = msg.on ? "详细：开" : "详细：关";
              break;
            case "passive":
              $("passiveToggle").classList.toggle("on", msg.on);
              $("passiveToggle").textContent = msg.on ? "被动：开" : "被动：关";
              break;
            case "audio_start":
              speechStart(msg.rate);
              break;
            case "audio_end":
              speechEnd();
              break;
            case "audio_stop":
              stopPlayback();
              break;
            case "chime": // passive mode: news went to the inbox
              tone([1320, 1760], 60);
              break;
            case "sent": // your words went to the current session
              tone([1046], 90);
              break;
          }
        };
      }

      // --- Session list: tap the current session in the header; tap a row to make it current ---

      const RUNNING = new Set(["running", "starting", "preparing", "queued"]);

      function renderSessions(items) {
        const list = $("sessions");
        list.replaceChildren(
          ...items.map((s) => {
            const li = document.createElement("li");
            li.className = s.current ? "current" : "";
            const kind = RUNNING.has(s.status)
              ? "running"
              : s.status === "waiting"
                ? "waiting"
                : s.status === "failed"
                  ? "failed"
                  : "";
            li.innerHTML =
              `<div class="row"><span class="name"></span>${s.unread ? `<span class="unread">${s.unread}</span>` : ""}` +
              `<span class="status ${kind}"></span></div><div class="meta"></div>`;
            li.querySelector(".name").textContent = (s.current ? "● " : "") + s.name;
            li.querySelector(".status").textContent = s.statusText;
            li.querySelector(".meta").textContent = `${s.project} · ${s.title}`;
            li.addEventListener("click", () => {
              if (ws && ws.readyState === WebSocket.OPEN)
                ws.send(JSON.stringify({ type: "select", id: s.id }));
              $("sheet").hidden = true;
            });
            return li;
          }),
        );
      }
      $("current").addEventListener("click", () => {
        $("sheet").hidden = false;
      });
      $("detailToggle").addEventListener("click", () => {
        const on = !$("detailToggle").classList.contains("on");
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "detail", on }));
      });
      $("passiveToggle").addEventListener("click", () => {
        const on = !$("passiveToggle").classList.contains("on");
        if (ws && ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify({ type: "passive", on }));
      });
      $("sheetClose").addEventListener("click", () => {
        $("sheet").hidden = true;
      });

      // --- Lost connection, told by ear: a drop that heals within a few seconds stays
      // silent; a real one gets a falling tone, and its end a rising one.

      let outageAlerted = false,
        outageTimer = null,
        everConnected = false;

      function connectionLost() {
        if (outageTimer || outageAlerted) return;
        outageTimer = setTimeout(() => {
          outageTimer = null;
          if (ws && ws.readyState === WebSocket.OPEN) return;
          outageAlerted = true;
          dbg("connection lost");
          tone([440, 294], 70);
        }, 3000);
      }

      function connectionBack() {
        clearTimeout(outageTimer);
        outageTimer = null;
        if (!outageAlerted) return;
        outageAlerted = false;
        dbg("connection back");
        tone([392, 523, 659], 70);
      }

      // --- Microphone: AudioWorklet that downsamples to 16 kHz s16le, 100 ms per frame ---

      const WORKLET = `
class Downsample extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ratio = sampleRate / 16000;
    this.acc = 0; this.sum = 0; this.n = 0;
    this.out = new Int16Array(1600); this.len = 0;
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.sum += ch[i]; this.n++; this.acc++;
      if (this.acc >= this.ratio) {
        this.acc -= this.ratio;
        const v = Math.max(-1, Math.min(1, this.sum / this.n));
        this.sum = 0; this.n = 0;
        this.out[this.len++] = v < 0 ? v * 32768 : v * 32767;
        if (this.len === this.out.length) {
          this.port.postMessage(this.out.buffer, [this.out.buffer]);
          this.out = new Int16Array(1600); this.len = 0;
        }
      }
    }
    return true;
  }
}
registerProcessor("downsample", Downsample);
`;

      async function ensureAudio() {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          const url = URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" }));
          await ctx.audioWorklet.addModule(url);
        }
        if (ctx.state !== "running") await ctx.resume();
        dbg(`audio context ${ctx.state}`);
      }

      async function startTurn(followup = null) {
        setState("starting");
        stopPlayback();
        // Recording and playback fight over the phone's audio session; the player stays
        // paused for the turn (stopMic resumes it).
        pausePlayer();
        try {
          await ensureAudio();
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          });
          const source = ctx.createMediaStreamSource(stream);
          const node = new AudioWorkletNode(ctx, "downsample");
          mic = { stream, source, node };
          ws.send(JSON.stringify(followup ? { type: "start", followup } : { type: "start" }));
          let frames = 0;
          node.port.onmessage = (event) => {
            frames++;
            if (mic && mic.node === node && ws.readyState === WebSocket.OPEN) ws.send(event.data);
          };
          setTimeout(() => {
            if (mic && mic.node === node && frames === 0) {
              const track = stream.getAudioTracks()[0];
              addLog(
                "error",
                `网页没录到声音（音频：${ctx.state}，麦克风：${track ? track.readyState + (track.muted ? "/静音" : "") : "无"}）`,
              );
            }
          }, 2500);
          source.connect(node);
          node.connect(ctx.destination); // outputs silence; keeps the node pulling audio
          keepAwake();
        } catch (error) {
          stopMic();
          addLog(
            "error",
            error.name === "NotAllowedError"
              ? "没有麦克风权限，去浏览器设置里允许。"
              : `开麦失败：${error.message}`,
          );
          setState("idle");
        }
      }

      function stopMic() {
        if (!mic) return;
        mic.source.disconnect();
        mic.node.disconnect();
        mic.stream.getTracks().forEach((t) => t.stop());
        mic = null;
        // Hand the audio session back to the player: Web Audio is only needed while recording.
        setTimeout(() => {
          if (!mic && ctx && ctx.state === "running") ctx.suspend();
          resumePlayer();
        }, 300);
      }

      function toggleTurn() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        if (state === "idle") startTurn();
        else if (state === "starting" || state === "listening") {
          if (state === "listening") beep([990, 660]);
          ws.send(JSON.stringify({ type: "stop" }));
          stopMic();
          setState("thinking");
        }
      }

      talk.addEventListener("click", () => {
        armPlayer();
        toggleTurn();
      });

      // --- One <audio> element for everything the page plays ---------------------------
      // iPhones cut sound off when a page plays through both Web Audio and an <audio>
      // element and they take turns. So speech plays through the same element that, the
      // rest of the time, loops silence. Being "the page that is playing" is also what makes
      // the browser send headset play/pause here (Media Session API): any of play, pause,
      // next, previous works like tapping the big button.

      let player = null; // the <audio> element; created on the first tap
      let clips = []; // speech waiting to play: object URLs of WAV files
      let speech = null; // PCM chunks of the announcement being received
      let ownPauseAt = 0; // when we last paused the element ourselves (its event comes later)
      let silentUrl = null;

      function wav(chunks, rate) {
        const n = chunks.reduce((sum, c) => sum + c.byteLength, 0);
        const buf = new ArrayBuffer(44 + n),
          v = new DataView(buf);
        const str = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
        str(0, "RIFF");
        v.setUint32(4, 36 + n, true);
        str(8, "WAVEfmt ");
        v.setUint32(16, 16, true);
        v.setUint16(20, 1, true);
        v.setUint16(22, 1, true);
        v.setUint32(24, rate, true);
        v.setUint32(28, rate * 2, true);
        v.setUint16(32, 2, true);
        v.setUint16(34, 16, true);
        str(36, "data");
        v.setUint32(40, n, true);
        let at = 44;
        for (const c of chunks) {
          new Uint8Array(buf, at, c.byteLength).set(new Uint8Array(c));
          at += c.byteLength;
        }
        return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
      }

      let switchedAt = 0; // when the player last changed what it plays

      function play(url, loop) {
        if (!player) return;
        if (player.src !== url) {
          switchedAt = Date.now();
          if (player.src && player.src !== silentUrl) URL.revokeObjectURL(player.src);
          player.src = url;
        }
        player.loop = loop;
        player.play().then(
          () => dbg(loop ? "silence playing" : "speech playing"),
          (error) => dbg(`play() rejected: ${error.name}`),
        );
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
      }

      // Back to the default: next queued speech, else silence. Never while recording.
      function resumePlayer() {
        if (!player || mic || state === "starting") return;
        if (clips.length) {
          const clip = clips.shift();
          playingFollowup = clip.followup;
          play(clip.url, false);
        } else if (player.src !== silentUrl || player.paused) play(silentUrl, true);
      }

      function pausePlayer() {
        if (!player || player.paused) return;
        ownPauseAt = Date.now();
        player.pause();
        // Still claim to be playing, so the headset's next press (to end the turn early)
        // may keep coming here. iPhone Safari ignores this while recording (checked): there
        // the turn ends on the pause or a tap on the big button.
        if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
      }

      function showHeadset() {
        const el = $("headset");
        if (!player) {
          el.textContent = "";
          return;
        }
        const ready = !player.paused || mic || state !== "idle";
        el.textContent = ready ? "🎧 耳机键可用" : "🎧 点一下页面恢复耳机键";
        el.className = ready ? "headset ready" : "headset";
      }

      // Double press reads the inbox. Most headsets send "next track" for it; some send two
      // play/pause instead, which cancels the turn the first one started.
      let lastPress = 0;
      function onHeadset(action) {
        const now = Date.now();
        // iPhones sometimes fire play/pause on their own right as the player switches from
        // speech back to silence; a real press that close to it is unlikely.
        if ((action === "play" || action === "pause") && now - switchedAt < 1000) {
          dbg(`ignored ${action}: player just switched`);
          return;
        }
        const double = now - lastPress < 700;
        lastPress = now;
        if (action === "previoustrack" && state === "idle") {
          // triple press: say the last one again
          if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "replay" }));
          return;
        }
        if (action === "nexttrack" || (double && (state === "starting" || state === "listening"))) {
          if (state === "starting" || state === "listening") {
            stopMic();
            setState("idle");
          }
          if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "inbox" }));
          return;
        }
        toggleTurn();
      }

      function armPlayer() {
        if (player) return;
        // 10 s of silence: phones ignore media shorter than ~5 s.
        silentUrl = wav([new ArrayBuffer(8000 * 2 * 10)], 8000);
        player = new Audio();
        player.addEventListener("play", showHeadset);
        player.addEventListener("pause", showHeadset);
        player.addEventListener("ended", () => {
          dbg("clip ended");
          followupAfterClip();
          resumePlayer();
        });
        player.addEventListener("pause", () => {
          if (Date.now() - ownPauseAt < 1000 || player.ended) return;
          dbg("paused by the system");
          setTimeout(resumePlayer, 500); // take the headset back
        });
        player.addEventListener("error", () => {
          dbg(`player error ${player.error && player.error.code}`);
          resumePlayer();
        });
        play(silentUrl, true); // inside the tap: unlocks the element for later play() calls
        if ("mediaSession" in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: "fwai 语音",
            artist: "按耳机键说话",
          });
          for (const action of ["play", "pause", "nexttrack", "previoustrack"]) {
            try {
              navigator.mediaSession.setActionHandler(action, () => {
                dbg(`headset: ${action}`);
                onHeadset(action);
              });
            } catch (_) {}
          }
          hint.textContent =
            "耳机键也可以用了：按一下说话，说完停顿自动发送；按两下听通知；按三下重播。";
        }
      }

      // After news from a session has been played, open the mic for a few seconds: what is
      // said then goes to that session (the server closes the window quietly on silence).
      let sayFollowup = null,
        playingFollowup = null;

      function followupAfterClip() {
        const thread = playingFollowup;
        playingFollowup = null;
        // The window is for the last announcement only: none queued, none still arriving.
        if (
          thread &&
          state === "idle" &&
          ws &&
          ws.readyState === WebSocket.OPEN &&
          !clips.length &&
          !speech
        ) {
          dbg(`followup window for ${thread}`);
          startTurn(thread);
        }
      }

      function speechStart(rate) {
        speech = { rate, chunks: [], followup: sayFollowup };
        sayFollowup = null;
        dbg("speech incoming");
      }
      function speechChunk(buffer) {
        if (speech && buffer.byteLength) speech.chunks.push(buffer);
      }
      function speechEnd() {
        if (!speech || !speech.chunks.length || !player) {
          speech = null;
          return;
        }
        clips.push({ url: wav(speech.chunks, speech.rate), followup: speech.followup });
        speech = null;
        dbg(`speech ready, ${clips.length} queued`);
        if (player.src === silentUrl || player.paused) resumePlayer();
      }

      // A short tone standing in for words, through the same <audio> element as speech
      // (on iPhones, Web Audio would fight it for the audio session).
      function tone(freqs, ms) {
        dbg(`tone ${freqs.join("/")}`);
        if (!player) return beep(freqs);
        const rate = 24000,
          n = Math.round((rate * ms) / 1000);
        const pcm = new Int16Array(n * freqs.length);
        freqs.forEach((f, k) => {
          for (let i = 0; i < n; i++) {
            const w = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (n - 1));
            pcm[k * n + i] = Math.sin((2 * Math.PI * f * i) / rate) * w * 0.25 * 32767;
          }
        });
        clips.push({ url: wav([pcm.buffer], rate), followup: null });
        if (player.src === silentUrl || player.paused) resumePlayer();
      }

      function stopPlayback() {
        speech = null;
        clips.forEach((clip) => URL.revokeObjectURL(clip.url));
        playingFollowup = null; // cut off: no reply window
        clips = [];
        if (player && player.src !== silentUrl && !player.paused) {
          pausePlayer();
          dbg("speech cut off");
        }
      }

      // --- Debug panel: tap the title to show what the audio is doing --------------------

      var debugLines = [];
      var debugOutbox = [];
      function dbg(text) {
        debugLines.push(`${new Date().toTimeString().slice(0, 8)} ${text}`);
        if (debugLines.length > 80) debugLines.shift();
        $("debug").textContent = debugLines.slice().reverse().join("\n");
        // Also into the server's log (fwai server log), so problems on a phone can be read there.
        debugOutbox.push(text);
        flushDebug();
      }
      function flushDebug() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        while (debugOutbox.length)
          ws.send(JSON.stringify({ type: "debug", text: debugOutbox.shift() }));
      }
      $("debugToggle").addEventListener("click", () => {
        $("debugToggle").classList.toggle("on", $("debug").classList.toggle("open"));
      });

      function beep(freqs) {
        if (!ctx || ctx.state !== "running") return;
        let t = ctx.currentTime;
        for (const f of freqs) {
          const osc = ctx.createOscillator(),
            gain = ctx.createGain();
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.2, t + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
          osc.connect(gain).connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.08);
          t += 0.075;
        }
      }

      // Keep the screen on while the page is in front, so a phone keeps listening and speaking.
      async function keepAwake() {
        if (wakeLock || !("wakeLock" in navigator) || document.visibilityState !== "visible")
          return;
        try {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => {
            wakeLock = null;
          });
        } catch (_) {}
      }
      document.addEventListener("visibilitychange", () => {
        dbg(`page ${document.visibilityState}`);
        if (document.visibilityState === "visible") {
          if (ctx) keepAwake();
          resumePlayer();
        }
      });

      // If something (a call, Siri, another app's audio) stopped the player, the headset
      // buttons go elsewhere. Try to take them back while idle; a tap anywhere also works,
      // since phones allow play() inside a tap.
      setInterval(() => {
        if (player && player.paused && state === "idle" && !mic) {
          dbg("player stopped while idle, resuming");
          resumePlayer();
        }
        showHeadset();
      }, 5000);
      document.addEventListener("click", (event) => {
        if (event.target !== talk && player && player.paused && state === "idle" && !mic)
          resumePlayer();
      });

      connect();
    </script>
  </body>
</html>
