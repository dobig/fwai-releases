name: Release target

# One desktop platform/arch, called once per target from release.yml. Adapted
# from upstream T3 Code's release-desktop.yml (in dobig/fwai_code): it packages
# the shared JS bundle, builds the native helpers and, where `cli_archive` is
# set, the CLI archive for its platform.

on:
  workflow_call:
    secrets:
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
    inputs:
      label:
        required: true
        type: string
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      arch:
        required: true
        type: string
      rust_target:
        required: true
        type: string
      cli_archive:
        required: false
        default: false
        type: boolean
      # A runner of the target's own platform and arch, for a `runner` that
      # cannot execute the target (Windows builds on Linux).
      verify_runner:
        required: false
        default: ""
        type: string
      version:
        required: true
        type: string
      stage:
        required: true
        type: string

env:
  STAGE: ${{ inputs.stage }}
  # electron-builder leaves the default arch (x64) out of the unpacked app's directory name.
  UNPACKED_DIR: ${{ inputs.platform }}-${{ inputs.arch != 'x64' && format('{0}-', inputs.arch) || '' }}unpacked

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.label }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Load stage
        shell: bash
        run: |
          set -euo pipefail
          . scripts/lib/fwai-stage.sh
          fwai_load_stage "$STAGE"
          for key in T3CODE_FWAI_STAGE T3CODE_FWAI_GATEWAY_URL T3CODE_FWAI_CLIENT_ID T3CODE_RELAY_URL VITE_HOSTED_APP_URL; do
            echo "$key=${!key}" >> "$GITHUB_ENV"
          done
          echo "T3CODE_DESKTOP_UPDATE_REPOSITORY=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: native/resource-monitor/target/${{ inputs.rust_target }}/release/t3-resource-monitor${{ inputs.platform == 'win' && '.exe' || '' }}
          key: resource-monitor-${{ inputs.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Cache Linux capture helpers
        if: inputs.platform == 'linux'
        id: capture_helper_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            native/kde-snap-shot/target/${{ inputs.rust_target }}/release/t3-kde-snap-shot
            native/hyprland-snap-shot/target/${{ inputs.rust_target }}/release/t3-hyprland-snap-shot
          key: linux-capture-helpers-${{ inputs.rust_target }}-${{ hashFiles('native/kde-snap-shot/Cargo.lock', 'native/kde-snap-shot/Cargo.toml', 'native/kde-snap-shot/src/**', 'native/hyprland-snap-shot/Cargo.lock', 'native/hyprland-snap-shot/Cargo.toml', 'native/hyprland-snap-shot/src/**', 'native/hyprland-snap-shot/protocols/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true' || (inputs.platform == 'linux' && steps.capture_helper_cache.outputs.cache-hit != 'true')
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ inputs.rust_target }}

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"

      # The artifact root is `apps/`, so extracting into `apps` restores
      # apps/server/dist and apps/desktop/dist-electron at their build paths.
      - name: Download JS bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: js-bundle
          path: apps

      - name: Install cargo-xwin
        if: inputs.platform == 'win' && steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-xwin@0.23.1

      - name: Build resource monitor
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo ${{ inputs.platform == 'win' && 'xwin build' || 'build' }} --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ inputs.rust_target }}"

      # The desktop build brands apps/server/dist/client itself; the CLI archive
      # ships the same client and is built first.
      - name: Apply web client branding
        if: inputs.cli_archive
        run: node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build CLI single-executable
        if: inputs.cli_archive
        shell: bash
        run: node apps/server/scripts/cli.ts build-exe --verbose ${{ inputs.platform == 'win' && format('--target win-{0}', inputs.arch) || '' }}

      - name: Import macOS signing certificate
        if: inputs.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # A macOS release is never shipped unsigned (docs/fwai/release.md).
          [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" ]] || { echo "::error::CSC_LINK / CSC_KEY_PASSWORD are not set"; exit 1; }
          keychain="$RUNNER_TEMP/fwai-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "::add-mask::$keychain_password"
          cert_path="$RUNNER_TEMP/fwai-signing.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$cert_path"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_path" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm -f "$cert_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          [[ -n "$identity" ]] || { echo "::error::no Developer ID Application identity in CSC_LINK"; exit 1; }
          echo "T3CODE_CLI_MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Stage resource monitor for the CLI archive
        if: inputs.cli_archive
        shell: bash
        run: |
          set -euo pipefail
          binary_name="t3-resource-monitor${{ inputs.platform == 'win' && '.exe' || '' }}"
          # The runtime looks the monitor up by Node's platform-arch key.
          case "${{ inputs.platform }}" in mac) os=darwin ;; win) os=win32 ;; *) os=linux ;; esac
          target_dir="$RUNNER_TEMP/cli-resource-monitor/$os-${{ inputs.arch }}"
          mkdir -p "$target_dir"
          cp "native/resource-monitor/target/${{ inputs.rust_target }}/release/${binary_name}" "$target_dir/$binary_name"

      - name: Build CLI archive
        if: inputs.cli_archive
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node scripts/build-cli-archive.ts \
            --platform "${{ inputs.platform }}" \
            --arch "${{ inputs.arch }}" \
            --version "${{ inputs.version }}" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" \
            --output-dir release-cli

      - name: Smoke-test CLI archive
        if: inputs.cli_archive && inputs.verify_runner == ''
        shell: bash
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "${{ inputs.version }}"

      - name: Upload CLI archive
        if: inputs.cli_archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-cli/*
          if-no-files-found: error

      - name: Install Linux desktop build libraries
        if: inputs.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      # The Windows app embeds the same-arch Linux CLI archive as its WSL
      # runtime; release.yml runs this job after that Linux job.
      - name: Download Linux CLI archive for WSL
        if: inputs.platform == 'win'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-linux-${{ inputs.arch }}
          path: wsl-runtime

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
          T3CODE_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: ${{ steps.capture_helper_cache.outputs.cache-hit == 'true' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          args=(
            --platform "${{ inputs.platform }}"
            --target "${{ inputs.target }}"
            --arch "${{ inputs.arch }}"
            --build-version "${{ inputs.version }}"
            --skip-build
            --verbose
          )
          if [[ -n "${{ inputs.verify_runner }}" ]]; then
            args+=(--keep-stage)
          fi
          case "${{ inputs.platform }}" in
            mac)
              # Same variables scripts/fwai-build-desktop.sh --signed sets from ~/.fwai-signing.
              export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
              args+=(--signed)
              ;;
            win)
              # Windows is unsigned (dobig/fwai_code#1, decision 17).
              unset CSC_LINK CSC_KEY_PASSWORD
              args+=(--wsl-runtime "$GITHUB_WORKSPACE"/wsl-runtime/fwai-*-linux-${{ inputs.arch }}.tar.gz)
              ;;
            *) unset CSC_LINK CSC_KEY_PASSWORD ;;
          esac
          vp run dist:desktop:artifact "${args[@]}"

      # The verify job runs what this host could not: the packaged natives and
      # the CLI. Its scripts are bundled so that job needs no install.
      - name: Stage verification inputs
        if: inputs.verify_runner != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          unpacked=$(ls -d "${TMPDIR:-/tmp}"/t3code-desktop-${{ inputs.platform }}-stage-*/app/dist/"$UNPACKED_DIR")
          tar -C "$(dirname "$unpacked")" -cf verify/unpacked.tar "$(basename "$unpacked")"
          esbuild=scripts/node_modules/.bin/esbuild
          banner="import{createRequire as __cr}from'node:module';const require=__cr(import.meta.url);"
          "$esbuild" scripts/verify-windows-desktop-artifact.ts --bundle --platform=node --format=esm \
            --target=node24 --define:import.meta.main=false --banner:js="$banner" \
            --outfile=verify/verify-windows-desktop-artifact.mjs
          "$esbuild" scripts/smoke-cli-archive.ts --bundle --platform=node --format=esm \
            --target=node24 --banner:js="$banner" --outfile=verify/smoke-cli-archive.mjs

      - name: Upload verification inputs
        if: inputs.verify_runner != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-${{ inputs.platform }}-${{ inputs.arch }}
          path: verify/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          patterns=(release/*.dmg release/*.zip release/*.AppImage release/*.exe)
          # Staging builds are preview versions: no update feed, so no manifests or blockmaps.
          if [[ "$STAGE" == prod ]]; then
            patterns+=(release/*.blockmap release/*.yml)
          fi
          for pattern in "${patterns[@]}"; do
            for file in $pattern; do
              [[ "$file" == */builder-debug.yml ]] || cp "$file" release-publish/
            done
          done
          # Per-arch updater manifests carry the same name; release.yml merges them.
          if [[ "${{ inputs.platform }}" == "mac" && "${{ inputs.arch }}" != "arm64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ inputs.arch }}.yml"
            done
          fi
          if [[ "${{ inputs.platform }}" == "win" ]]; then
            for manifest in release-publish/*.yml; do
              mv "$manifest" "${manifest%.yml}-win-${{ inputs.arch }}.yml"
            done
          fi
          ls -la release-publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-publish/*
          if-no-files-found: error

  verify:
    name: Verify ${{ inputs.label }}
    needs: [build]
    if: inputs.verify_runner != ''
    runs-on: ${{ inputs.verify_runner }}
    timeout-minutes: 15
    steps:
      - name: Download verification inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verify-${{ inputs.platform }}-${{ inputs.arch }}
          path: verify

      - name: Download CLI archive
        if: inputs.cli_archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-cli

      - name: Verify packaged natives
        shell: bash
        run: |
          set -euo pipefail
          tar -C verify -xf verify/unpacked.tar
          node verify/verify-windows-desktop-artifact.mjs \
            --app-dir "$(cygpath -w "$PWD/verify/$UNPACKED_DIR")" \
            --arch "${{ inputs.arch }}" --build-version "${{ inputs.version }}" --verbose

      - name: Smoke-test CLI archive
        if: inputs.cli_archive
        shell: bash
        run: node verify/smoke-cli-archive.mjs --archive release-cli/* --expect-version "${{ inputs.version }}"
